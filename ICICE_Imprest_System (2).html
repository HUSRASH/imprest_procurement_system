'use strict';
/* ============================================================
   Payments Log — every payment made by the Finance Office.
   Imprest disbursements are logged AUTOMATICALLY the moment
   Finance marks an imprest as disbursed; supplier payments are
   logged manually after a Purchase Order has been issued.
   ============================================================ */

function canSeePayments() { return hasPerm('view_all') || hasPerm('approve_dg') || hasPerm('log_payments'); }
function canLogPayments() { return hasPerm('log_payments'); }
function nextPayCode() { return 'PAY-' + new Date().getFullYear() + '-' + String(S.counters.payment++).padStart(4, '0'); }
function payById(id) { return (S.payments || []).find(p => p.id === id); }
function payLinkedRef(p) {
  if (p.type === 'imprest') { const i = impById(p.imprestId); return i ? i.code : '—'; }
  const pr = procById(p.procurementId); return pr ? pr.code + (pr.stage && pr.stage.poNumber ? ' · PO ' + pr.stage.poNumber : '') : '—';
}
function paidSoFar(procId) { return (S.payments || []).filter(x => x.procurementId === procId).reduce((s, x) => s + (Number(x.amount) || 0), 0); }

/* auto-log on imprest disbursement — the sheet can never fall behind */
function autoLogDisbursement(imp) {
  if (!S.payments) S.payments = [];
  if (S.payments.some(p => p.imprestId === imp.id)) return null; // never duplicate
  const pay = {
    id: uid(), ref: nextPayCode(), type: 'imprest', imprestId: imp.id, procurementId: null,
    beneficiary: imp.requesterName, department: imp.department, amount: Number(imp.amount) || 0,
    method: imp.disbursement.method, voucher: imp.disbursement.voucher || '', date: imp.disbursement.date,
    at: nowISO(), status: 'paid', loggedById: ME ? ME.id : '', loggedByName: ME ? ME.name : 'System',
    note: 'Auto-logged on disbursement of ' + imp.code
  };
  S.payments.unshift(pay);
  return pay;
}

/* checks & balances: disbursed vs retired vs outstanding */
function payChecks() {
  const live = i => ['disbursed', 'retirement_pending', 'retirement_lead', 'retirement_hod', 'retirement_dg', 'retired'].includes(i.status);
  const disbursedImps = S.imprests.filter(live);
  return {
    disbursed: disbursedImps.reduce((s, i) => s + Number(i.amount || 0), 0),
    disbursedCount: disbursedImps.length,
    retired: S.imprests.filter(i => i.status === 'retired').reduce((s, i) => s + impSpent(i), 0),
    retiredCount: S.imprests.filter(i => i.status === 'retired').length,
    inCirc: S.imprests.filter(i => i.status === 'disbursed').reduce((s, i) => s + Number(i.amount || 0), 0),
    inCircCount: S.imprests.filter(i => i.status === 'disbursed').length,
    inReview: S.imprests.filter(i => ['retirement_pending', 'retirement_dg'].includes(i.status)).reduce((s, i) => s + Number(i.amount || 0), 0)
  };
}

ACTIONS.pay_export = () => {

ACTIONS.vault_search = debounce((d, el) => { ui.vaultQ = el.value; render(); refocusInput('[data-input="vault_search"]'); }, 250);
ACTIONS.vault_upload = () => pickFiles(async (files) => {
  const docs = await registerFiles(files, { module: 'General upload', refCode: '', department: ME ? ME.department : '' });
  if (docs.length) { save(); toast(docs.length + ' file(s) uploaded to the vault.'); render(); }
});
function storageBytes() {
  let used = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); used += (localStorage.getItem(k) || '').length + k.length; } } catch (e) {}
  const quota = 5 * 1024 * 1024; // ~5MB typical localStorage limit (chars ≈ 2 bytes UTF-16, keep conservative)
  return { used: used * 2, quota, pct: Math.round(used * 2 / quota * 100) };
}

/* ---------- Charts ---------- */
const CHART_COLORS = ['#0e6b4f', '#c9a227', '#1f5fb0', '#6d3bb8', '#b45d0a', '#178a54', '#c0341d'];
function hbarChart(items) {
  const max = Math.max(1, ...items.map(i => i.value));
  return `<div class="hbar">${items.map(i => `
    <div class="hb"><div class="hl"><span>${esc(i.label)}</span><span class="hv">${i.fmt || fmtMoney(i.value)}</span></div>
    <div class="track"><div style="width:${Math.max(3, Math.round(i.value / max * 100))}%"></div></div></div>`).join('')}</div>`;
}
function donut(items) {
  const total = items.reduce((s, i) => s + i.value, 0) || 1;
  const R = 52, C = 2 * Math.PI * R; let off = 0;
  const segs = items.filter(i => i.value > 0).map(i => {
    const frac = i.value / total;
    const seg = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${i.color}" stroke-width="21" stroke-dasharray="${(frac * C).toFixed(2)} ${C.toFixed(2)}" transform="rotate(${(off * 360 - 90).toFixed(2)} 70 70)"></circle>`;
    off += frac; return seg;
  }).join('');
  return `<div class="flex" style="gap:20px;flex-wrap:wrap">
    <svg viewBox="0 0 140 140" style="width:150px;height:150px;flex-shrink:0">${segs}
      <text x="70" y="66" text-anchor="middle" font-size="20" font-weight="800" fill="#13211c">${items.reduce((s, i) => s + i.value, 0)}</text>
      <text x="70" y="84" text-anchor="middle" font-size="9.5" fill="#5f6f69">TOTAL</text></svg>
    <div class="chart-legend" style="flex-direction:column;gap:8px">${items.map(i => `
      <div class="li"><span class="sw" style="background:${i.color}"></span>${esc(i.label)} <b style="margin-left:auto;color:var(--ink)">${i.value}</b></div>`).join('')}</div></div>`;
}
function lineChart(labels, series) {
  const W = 620, H = 240, PL = 56, PR = 16, PT = 16, PB = 36;
  const n = labels.length;
  const max = Math.max(1, ...series.flatMap(s => s.values));
  const niceMax = Math.ceil(max / 500000) * 500000 || 500000;
  const x = i => PL + (W - PL - PR) * (n < 2 ? 0.5 : i / (n - 1));
  const y = v => H - PB - (H - PT - PB) * (v / niceMax);
  let grid = '';
  for (let g = 0; g <= 4; g++) {
    const v = niceMax * g / 4, yy = y(v);
    grid += `<line x1="${PL}" y1="${yy}" x2="${W - PR}" y2="${yy}" stroke="#e8efec" stroke-width="1"></line>
      <text x="${PL - 8}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#8fa19a">${v >= 1000000 ? (v / 1000000) + 'M' : v >= 1000 ? Math.round(v / 1000) + 'k' : v}</text>`;
  }
  const xlabels = labels.map((l, i) => `<text x="${x(i)}" y="${H - 14}" text-anchor="middle" font-size="10.5" fill="#5f6f69">${esc(l)}</text>`).join('');
  const lines = series.map(s => `
    <polyline fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
      points="${s.values.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ')}"></polyline>
    ${s.values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="${s.color}" stroke-width="2.5"></circle>`).join('')}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg">${grid}${xlabels}${lines}</svg>
    <div class="chart-legend">${series.map(s => `<div class="li"><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</div>`).join('')}</div>`;
}

    { n: 'Drafts', c: myDrafts.length, cls: 's-muted' },
    { n: 'Pending approval', c: myPendingReq.length, cls: 's-warn' },
    { n: 'Disbursed — with me', c: myDisb.length, cls: 's-purple' },
    { n: 'In retirement review', c: myImps.filter(i => ['retirement_pending', 'retirement_dg'].includes(i.status)).length, cls: 's-info' },
    { n: 'Retired', c: myRetired.length, cls: 's-ok' },
    { n: 'Rejected', c: myRejected.length, cls: 's-danger' }
  ].filter(x => x.c > 0);
  const retirementSection = !showRetirement ? '' : `
  <div class="card mb20">
    <div class="card-h">${icon('wallet', 16)}<div class="t">My Retirement</div>
      <div class="sub">my imprest requests & retirements — only I can see this</div>
      ${canReq ? `<button class="btn sm primary" data-act="imp_new" style="margin-left:auto">${icon('plus', 13)} New Imprest Request</button>` : ''}</div>
    <div class="card-b">
      <div class="flex wrap mb14" style="gap:8px">${myChips.length ? myChips.map(c => `<span class="pill ${c.cls}"><span class="dot"></span>${c.n}:&nbsp;<b>${c.c}</b></span>`).join('') : '<span class="muted small">No imprest records yet — start with your first request.</span>'}</div>
      <div class="grid-2-1">
        <div>${myImps.length ? lineChart(months.map(m => m.label), [
            { name: 'My imprest requested', color: '#0e6b4f', values: myReqSeries },
            { name: 'My spending', color: '#c9a227', values: mySpendSeries }])
          : '<div class="empty" style="padding:30px 10px"><div class="e-ic" style="width:44px;height:44px;border-radius:12px">' + icon('wallet', 20) + '</div><div class="e-t" style="font-size:13.5px">Your retirement activity chart appears here</div><div class="e-s">once you create your first imprest request.</div></div>'}</div>
        <div>
          <div class="detail-grid mb14">
            <div class="dg-item"><div class="l">Lifetime requested</div><div class="v big">${fmtMoney(myImps.reduce((s, i) => s + Number(i.amount || 0), 0))}</div></div>
            <div class="dg-item"><div class="l">My spending</div><div class="v big">${fmtMoney(mySpent)}</div></div>
            <div class="dg-item"><div class="l">Evidence files</div><div class="v big">${myEvidence}</div></div>
            <div class="dg-item"><div class="l">Unretired with me</div><div class="v big">${fmtMoney(myUnretired)}</div></div>
          </div>
          ${myImps.slice(0, 4).map(i => `<div class="task-item"><div class="grow"><div class="strong">${i.code}</div>
            <div class="small muted">${fmtMoney(i.amount)} · ${esc(i.purpose.slice(0, 46))}${i.purpose.length > 46 ? '…' : ''}</div></div>
            ${pill(i.status)}<button class="btn sm" data-act="imp_view" data-id="${i.id}">Open</button></div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;

  /* ---------- ALL PROCUREMENT section (professional, consolidated) ---------- */
  function buildProcOverview(withLogBtn) {
    const chips = [
      { n: 'Pending HoD Shared Services', c: stC('pending_hod'), cls: 's-warn' },
      { n: 'Pending Chief of Staff', c: stC('pending_cos'), cls: 's-info' },
      { n: 'Pending DG', c: stC('pending_dg'), cls: 's-info' },
      { n: 'Approved — awaiting PO', c: stC('approved'), cls: 's-purple' },
      { n: 'PO issued', c: stC('po_issued'), cls: 's-purple' },
      { n: 'Delivered', c: stC('delivered'), cls: 's-purple' },
      { n: 'Completed', c: stC('completed'), cls: 's-ok' },
      { n: 'Rejected', c: stC('rejected'), cls: 's-danger' }
    ].filter(x => x.c > 0);
    const byDept = S.settings.departments.map(d => ({ label: d.length > 26 ? d.slice(0, 24) + '…' : d, value: procs.filter(p => p.department === d).reduce((s, p) => s + (Number(p.amount) || 0), 0) })).filter(x => x.value > 0);
    const funnel = [
      { label: 'HoD Shared Services', n: stC('pending_hod'), color: '#b45d0a' },
      { label: 'Chief of Staff', n: stC('pending_cos'), color: '#c9a227' },
      { label: 'DG final', n: stC('pending_dg'), color: '#1f5fb0' },
      { label: 'Approved / PO', n: procs.filter(p => ['approved', 'po_issued', 'delivered', 'completed'].includes(p.status)).length, color: '#178a54' },
      { label: 'Rejected', n: stC('rejected'), color: '#c0341d' }
    ];
    const fMax = Math.max(1, ...funnel.map(f => f.n));
    const recent = procs.slice().sort((a, b) => ((b.updatedAt || b.createdAt) < (a.updatedAt || a.createdAt) ? -1 : 1)).slice(0, 6);
    return `
    <div class="card mb20">
      <div class="card-h">${icon('cart', 16)}<div class="t">All Procurement</div>
        <div class="sub">every request raised by all members — approvals, disbursement (PO) & delivery</div>
        ${canLog ? `<span class="pill s-gold" style="margin-left:auto">Logged by you: ${myProcs.length}</span>` : ''}
        ${withLogBtn ? `<button class="btn sm primary" data-act="proc_new">${icon('plus', 13)} Log Procurement</button>` : ''}</div>
      <div class="card-b">
        <div class="flex wrap mb14" style="gap:8px">${chips.length ? chips.map(c => `<span class="pill ${c.cls}"><span class="dot"></span>${c.n}:&nbsp;<b>${c.c}</b></span>`).join('') : '<span class="muted small">No procurement requests have been logged yet.</span>'}</div>
        <div class="grid-2-1 mb14">
          <div>${lineChart(months.map(m => m.label), [{ name: 'Procurement value logged', color: '#6d3bb8', values: procMonthSeries }])}</div>
          <div>${funnel.map(f => `<div class="funnel-step"><div class="fl">${f.label}</div>
            <div class="ft"><div style="width:${Math.max(6, Math.round(f.n / fMax * 100))}%;background:${f.color}">${f.n}</div></div><div class="fn"></div></div>`).join('')}
            <div class="small muted mt8">Approval chain: HoD Shared Services → Chief of Staff → DG · then PO → delivery → completion.</div></div>
        </div>
        <div class="grid2">
          <div><div class="sec-title" style="margin-top:0">By department (value)</div>${byDept.length ? hbarChart(byDept) : '<div class="muted small">No data yet.</div>'}</div>
          <div><div class="sec-title" style="margin-top:0">Latest requests — all members</div>
            ${recent.map(p => `<div class="task-item"><div class="grow"><div class="strong">${p.code} — ${esc(p.title.slice(0, 38))}${p.title.length > 38 ? '…' : ''}</div>
              <div class="small muted">${esc(p.department)}${p.amount ? ' · ' + fmtMoney(p.amount) : ''} · by ${esc(p.loggedByName || p.requesterName)}</div></div>
              ${pill(p.status, PROC_STATUS)}<button class="btn sm" data-act="proc_view" data-id="${p.id}">Open</button></div>`).join('') || '<div class="muted small">Nothing yet.</div>'}
          </div>
        </div>
      </div>
    </div>`;
  }

  let procurementSection = '';
  if (canLog) procurementSection = buildProcOverview(true);
  else if (isProcApprover) {
    const queues = [];
    if (hasPerm('appr_hod')) procs.filter(p => p.status === 'pending_hod').forEach(p => queues.push({ p, a: 'proc_decide', st: 'hod' }));
    if (hasPerm('appr_cos')) procs.filter(p => p.status === 'pending_cos').forEach(p => queues.push({ p, a: 'proc_decide', st: 'cos' }));
    if (hasPerm('approve_dg')) procs.filter(p => p.status === 'pending_dg').forEach(p => queues.push({ p, a: 'proc_decide', st: 'dg' }));
    procurementSection = `
    <div class="card mb20">
      <div class="card-h">${icon('cart', 16)}<div class="t">My Procurement</div>
        <div class="sub">requests waiting for your decision in the approval chain</div></div>
      <div class="card-b" style="padding:8px 18px 14px">
        ${queues.length ? queues.slice(0, 6).map(({ p, a, st }) => `<div class="task-item"><div class="grow"><div class="strong">${p.code} — ${esc(p.title.slice(0, 40))}${p.title.length > 40 ? '…' : ''}</div>
          <div class="small muted">${esc(p.department)}${p.amount ? ' · ' + fmtMoney(p.amount) : ''} · ${esc(p.requesterName)}</div></div>
          ${pill(p.status, PROC_STATUS)}<button class="btn sm primary" data-act="${a}" data-id="${p.id}" data-stage="${st}">Review</button></div>`).join('')
          : '<div class="muted small" style="padding:10px 0">No procurement requests are waiting on you ✔</div>'}
      </div>
    </div>`;
  } else {
    procurementSection = `
    <div class="card mb20">
      <div class="card-h">${icon('cart', 16)}<div class="t">My Procurement</div><div class="sub">how departmental purchases work</div></div>
      <div class="card-b">
        <div class="callout info">${icon('info', 15)}<div>Departmental purchase requests are sent to <b>${esc(S.settings.contacts.procurement)}</b> and raised on G-Suite by the Procurement Officer.
        Each request is approved through the chain <b>HoD Shared Services → Chief of Staff → Director General</b> before a Purchase Order is issued.
        Contact the Procurement Officer for the status of any departmental request.</div></div>
      </div>
    </div>`;
  }

  /* ---------- ALL IMPREST section (consolidated — Finance, DG, Super Admin) ---------- */
  let impAllSection = '';
  if (impAll) {
    const chips = [
      { n: 'Newly requested', c: newlyRequested.length, cls: 's-warn' },
      { n: 'Awaiting disbursement', c: awaitingDisb.length, cls: 's-info' },
      { n: 'In circulation', c: inCirc.length, cls: 's-purple' },
      { n: 'In retirement review', c: inRetReview.length, cls: 's-info' },
      { n: 'Retired', c: allRetired.length, cls: 's-ok' },
      { n: 'Rejected', c: allRejected.length, cls: 's-danger' }
    ].filter(x => x.c > 0);
    const statusDonut = Object.keys(IMP_STATUS).map((k, ix) => ({ label: IMP_STATUS[k].label, value: imps.filter(i => i.status === k).length, color: CHART_COLORS[ix % CHART_COLORS.length] })).filter(i => i.value > 0);
    const byDept = S.settings.departments.map(d => ({ label: d.length > 26 ? d.slice(0, 24) + '…' : d, value: imps.filter(i => i.department === d && i.status !== 'draft').reduce((s, i) => s + Number(i.amount || 0), 0) })).filter(i => i.value > 0);
    const newest = newlyRequested.slice().sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1)).slice(0, 3);
    const lastRetired = allRetired.slice().sort((a, b) => (retDate(a) < retDate(b) ? 1 : -1)).slice(0, 3);
    impAllSection = `
    <div class="card mb20">
      <div class="card-h">${icon('wallet', 16)}<div class="t">All Imprest — Every Member</div>
        <div class="sub">consolidated view: new requests, circulation & retirements across all departments</div></div>
      <div class="card-b">
        <div class="flex wrap mb14" style="gap:8px">${chips.length ? chips.map(c => `<span class="pill ${c.cls}"><span class="dot"></span>${c.n}:&nbsp;<b>${c.c}</b></span>`).join('') : '<span class="muted small">No imprest records yet.</span>'}</div>
        <div class="grid-2-1 mb14">
          <div>${lineChart(months.map(m => m.label), [
            { name: 'Imprest requested', color: '#0e6b4f', values: impReqSeries },
            { name: 'Retired (spent)', color: '#c9a227', values: impRetSeries }])}</div>
          <div>${statusDonut.length ? donut(statusDonut) : '<div class="muted small">No imprest records yet.</div>'}</div>
        </div>
        <div class="grid2">
          <div><div class="sec-title" style="margin-top:0">By department (imprest value)</div>${byDept.length ? hbarChart(byDept) : '<div class="muted small">No data yet.</div>'}</div>
          <div>
            <div class="sec-title" style="margin-top:0">Newly requested — latest</div>
            ${newest.map(i => `<div class="task-item"><div class="grow"><div class="strong">${i.code}</div>
              <div class="small muted">${fmtMoney(i.amount)} · ${esc(i.department)} · ${esc(i.requesterName)}</div></div>
              ${pill(i.status)}<button class="btn sm" data-act="imp_view" data-id="${i.id}">Open</button></div>`).join('') || '<div class="muted small mb14">Nothing pending.</div>'}
            <div class="sec-title">Recently retired — latest</div>
            ${lastRetired.map(i => `<div class="task-item"><div class="grow"><div class="strong">${i.code}</div>
              <div class="small muted">${fmtMoney(impSpent(i))} spent · ${esc(i.department)} · ${esc(i.requesterName)}</div></div>
              ${pill(i.status)}<button class="btn sm" data-act="imp_view" data-id="${i.id}">Open</button></div>`).join('') || '<div class="muted small">Nothing retired yet.</div>'}
          </div>
        </div>
      </div>
    </div>`;
  }

  /* ---------- consolidated procurement for Finance / DG (non-loggers) ---------- */
  const procAllSection = (procAll && !canLog) ? buildProcOverview(false) : '';

  /* ---------- payments — checks & balances (Finance / DG / Super Admin) ---------- */
  const paymentsSection = canSeePayments() ? paymentsDashCard() : '';

  /* ---------- system / operations strip (Super Admin; overview for DG & Finance) ---------- */
  let systemSection = '';
  if (isSA || canSeeAll) {
    systemSection = `
    <div class="card mb20">
      <div class="card-h">${icon('db', 16)}<div class="t">${isSA ? 'System' : 'Operations overview'}</div><div class="sub">${isSA ? 'everything the platform manages' : 'totals across the platform — user management & settings remain with the Super Admin'}</div></div>
      <div class="card-b detail-grid">
        ${isSA ? `<div class="dg-item"><div class="l">Users</div><div class="v big">${S.users.filter(u => u.active).length}<small> active / ${S.users.length}</small></div></div>` : ''}
        <div class="dg-item"><div class="l">Departments</div><div class="v big">${S.settings.departments.length}</div></div>
        <div class="dg-item"><div class="l">Imprest records</div><div class="v big">${imps.length}</div></div>
        <div class="dg-item"><div class="l">Procurement records</div><div class="v big">${procs.length}</div></div>
        <div class="dg-item"><div class="l">Payments logged</div><div class="v big">${(S.payments || []).length}</div><div class="ks small muted">${fmtMoney((S.payments || []).reduce((s2, p) => s2 + (Number(p.amount) || 0), 0))} total value</div></div>
        <div class="dg-item"><div class="l">Documents in vault</div><div class="v big">${S.documents.length}</div></div>
      </div>
    </div>`;
  }

  /* ---------- my tasks (role-aware) ---------- */
  const tasks = [];
  IMP_STAGES.forEach(st => {
    if (!hasPerm(st.perm)) return;
    imps.filter(i => i.status === st.status).forEach(i => tasks.push({ t: 'Imprest ' + i.code + ' — ' + st.title, s: fmtMoney(i.amount) + ' · ' + i.department + ' · ' + i.requesterName, a: 'imp_decide', id: i.id, stage: st.key, flow: 'req', al: 'Review' }));
    imps.filter(i => i.status === st.retStatus).forEach(i => tasks.push({ t: 'Retirement ' + i.code + ' — ' + st.title, s: fmtMoney(impSpent(i)) + ' spent · ' + i.requesterName, a: 'imp_decide', id: i.id, stage: st.key, flow: 'ret', al: 'Review' }));
  });
  if (hasPerm('appr_raising')) imps.filter(i => i.status === 'approved').forEach(i => tasks.push({ t: 'Disburse imprest ' + i.code, s: fmtMoney(i.amount) + ' · ' + i.requesterName, a: 'imp_disburse', id: i.id, al: 'Disburse' }));
  PROC_STAGES.forEach(st => {
    if (!hasPerm(st.perm)) return;
    procs.filter(p => p.status === st.status).forEach(p => tasks.push({ t: 'Procurement ' + p.code + ' — ' + st.title, s: p.title, a: 'proc_decide', id: p.id, stage: st.key, al: 'Review' }));
  });
  if (canReq) imps.filter(i => i.requesterId === ME.id && i.status === 'disbursed' && !i.retirement.submittedAt).forEach(i => tasks.push({ t: 'Retire imprest ' + i.code, s: 'Record spending & upload evidence', a: 'imp_view', id: i.id, al: 'Open' }));
  if (canLog) {
    procs.filter(p => p.status === 'returned').forEach(p => tasks.push({ t: 'Correct & resubmit — ' + p.code, s: p.title, a: 'proc_resubmit', id: p.id, al: 'Open' }));
    procs.filter(p => p.status === 'approved').forEach(p => tasks.push({ t: 'Issue Purchase Order — ' + p.code, s: p.title, a: 'proc_view', id: p.id, al: 'Open' }));
    procs.filter(p => p.status === 'po_issued').forEach(p => tasks.push({ t: 'Mark delivered — ' + p.code, s: p.title, a: 'proc_view', id: p.id, al: 'Open' }));
    procs.filter(p => p.status === 'delivered').forEach(p => tasks.push({ t: 'Close as completed — ' + p.code, s: p.title, a: 'proc_view', id: p.id, al: 'Open' }));
  }

  /* ---------- recent activity (scoped to what I may see) ---------- */
  const actImps = canSeeAll ? imps : myImps;
  const actProcs = canProc ? procs : [];
  const activity = [];
  actImps.forEach(i => (i.timeline || []).slice(0, 3).forEach(e => activity.push({ at: e.at, text: i.code + ' — ' + e.text, sub: e.by + (e.sub ? ' · ' + e.sub : ''), ic: 'wallet' })));
  actProcs.forEach(p => (p.timeline || []).slice(0, 3).forEach(e => activity.push({ at: e.at, text: p.code + ' — ' + e.text, sub: e.by + (e.sub ? ' · ' + e.sub : ''), ic: 'cart' })));
  activity.sort((a, b) => (a.at < b.at ? 1 : -1));

  return `
  <div class="pg-head">
    <div><h1>As-salamu alaykum, ${esc(ME.name.split(' ')[0])} 👋</h1>
      <div class="desc">${greet} — this is your personal dashboard for imprest retirement${canProc ? ' and procurement' : ''}, ${esc(ME.name)}.${impAll ? ' It includes the consolidated view of every member\u2019s imprest.' : ''}${procAll ? ' You also see every procurement request raised.' : ''} ${fmtDate(nowISO())}.</div></div>
    <div class="acts">
      ${canReq ? `<button class="btn primary" data-act="imp_new">${icon('plus', 15)} New Imprest Request</button>` : ''}
      ${canLog ? `<button class="btn gold" data-act="proc_new">${icon('cart', 15)} Log Procurement</button>` : ''}
    </div>
  </div>

  ${kpis.length ? `<div class="kpis">${kpis.join('')}</div>` : ''}

  ${retirementSection}
  ${procurementSection}
  ${impAllSection}
  ${procAllSection}
  ${paymentsSection}
  ${systemSection}

  <div class="grid-2-1">
    <div class="card"><div class="card-h">${icon('clock', 16)}<div class="t">Your tasks</div><span class="pill ${tasks.length ? 's-warn' : 's-ok'}">${tasks.length} open</span></div>
      <div class="card-b" style="padding:8px 18px 14px">${tasks.length ? tasks.slice(0, 6).map(t => `
        <div class="task-item"><div class="grow"><div class="strong">${esc(t.t)}</div><div class="small muted">${esc(t.s || '')}</div></div>
          <button class="btn sm primary" data-act="${t.a}" data-id="${t.id}" data-stage="${t.stage || ''}" data-flow="${t.flow || ''}">${t.al}</button></div>`).join('')
        : `<div class="empty" style="padding:24px"><div class="e-t" style="font-size:13.5px">You are all caught up 🎉</div><div class="e-s">No pending tasks assigned to you.</div></div>`}</div></div>
    <div class="card"><div class="card-h">${icon('refresh', 16)}<div class="t">Recent activity</div><div class="sub">${canSeeAll ? 'every member' : 'your records only'}</div></div>
      <div class="card-b" style="padding:8px 18px 12px;max-height:380px;overflow-y:auto">${activity.slice(0, 10).map(a => `
        <div class="activity-item"><div class="a-ic">${icon(a.ic, 14)}</div>
          <div class="grow"><div class="a-t">${esc(a.text)}</div><div class="a-d">${esc(a.sub)} · ${timeAgo(a.at)}</div></div></div>`).join('') || '<div class="muted small">No activity yet.</div>'}</div></div>
  </div>

  <div class="mt20 card card-b">
    <div class="sec-title" style="margin-top:0">Quick actions</div>
    <div class="quick-actions">
      ${canReq ? `<div class="qa" data-act="imp_new"><div class="qa-ic">${icon('wallet', 17)}</div><div><div class="qa-t">New imprest</div><div class="qa-s">Request petty cash</div></div></div>` : ''}
      ${canLog ? `<div class="qa" data-act="proc_new"><div class="qa-ic">${icon('cart', 17)}</div><div><div class="qa-t">Log procurement</div><div class="qa-s">From email / G-Suite</div></div></div>` : ''}
      ${canReq ? `<div class="qa" data-act="go" data-page="imprest"><div class="qa-ic">${icon('file', 17)}</div><div><div class="qa-t">My imprest records</div><div class="qa-s">Requests & retirements</div></div></div>` : ''}
      ${isProcApprover ? `<div class="qa" data-act="go" data-page="approvals"><div class="qa-ic">${icon('check2', 17)}</div><div><div class="qa-t">Approvals</div><div class="qa-s">Items waiting on you</div></div></div>` : ''}
      ${procAll ? `<div class="qa" data-act="go" data-page="procurement"><div class="qa-ic">${icon('cart', 17)}</div><div><div class="qa-t">Procurement tracker</div><div class="qa-s">All requests & stages</div></div></div>` : ''}
      ${impAll ? `<div class="qa" data-act="go" data-page="imprest"><div class="qa-ic">${icon('wallet', 17)}</div><div><div class="qa-t">All imprest records</div><div class="qa-s">Every department</div></div></div>` : ''}
      ${hasPerm('access_vault') ? `<div class="qa" data-act="go" data-page="vault"><div class="qa-ic">${icon('archive', 17)}</div><div><div class="qa-t">Storage vault</div><div class="qa-s">Documents & downloads</div></div></div>` : ''}
      ${hasPerm('manage_users') ? `<div class="qa" data-act="user_new"><div class="qa-ic">${icon('users', 17)}</div><div><div class="qa-t">Create account</div><div class="qa-s">Add a user</div></div></div>` : ''}
    </div>
  </div>`;
}

/* ---------- Pages registry ---------- */
const PAGES = {
  dashboard: { title: 'Dashboard', fn: pageDashboard },
  imprest: { title: 'Imprest & Retirement', fn: pageImprest },
  payments: { title: 'Payments Log', fn: pagePayments },
  approvals: { title: 'Approvals', fn: pageApprovals },
  procurement: { title: 'Procurement Tracker', fn: pageProcurement },
  vault: { title: 'Storage Vault', fn: pageVault },
  users: { title: 'User Management', fn: pageUsers },
  settings: { title: 'Settings', fn: pageSettings }
};
function navItems() {
  const it = [{ id: 'dashboard', label: 'Dashboard', icon: 'grid' }];
  if (hasPerm('request_imprest') || hasPerm('view_all')) it.push({ id: 'imprest', label: 'Imprest & Retirement', icon: 'wallet' });
  if (canSeePayments()) it.push({ id: 'payments', label: 'Payments Log', icon: 'creditcard' });
  if (hasPerm('appr_raising') || hasPerm('appr_lead_acct') || hasPerm('appr_hod') || hasPerm('appr_cos') || hasPerm('approve_dg')) it.push({ id: 'approvals', label: 'Approvals', icon: 'check', badge: true });
  if (canSeeProcurement()) it.push({ id: 'procurement', label: 'Procurement', icon: 'cart' });
  if (hasPerm('access_vault')) it.push({ id: 'vault', label: 'Storage Vault', icon: 'archive' });
  if (hasPerm('manage_users')) it.push({ id: 'users', label: 'Users', icon: 'users' });

function genPw() {
  const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789@#$%';
  let p = ''; for (let i = 0; i < 10; i++) p += cs[Math.floor(Math.random() * cs.length)];
  return p;
}

  if (e.target && e.target.id === 'roleSelect') {
    const preset = ROLES[e.target.value].perms;
    $$('.perm-sw').forEach(sw => { sw.checked = preset.includes(sw.name.replace('perm_', '')); });
  }
});
FORMS.user_form = (fd, form) => {
  const id = form.dataset.id;
  const name = fd.get('name').trim(), email = String(fd.get('email')).toLowerCase().trim();
  const role = fd.get('role'), dept = fd.get('department');
  const perms = PERM_KEYS.filter(p => fd.get('perm_' + p) === 'on');
  if (!name || !email) { toast('Name and email are required.', 'error'); return; }
  if (S.users.find(u => u.email === email && u.id !== id)) { toast('That email is already used by another account.', 'error'); return; }
  if (id) {
    const u = S.users.find(x => x.id === id);
    Object.assign(u, { name, email, role, department: dept, permissions: role === 'super_admin' ? PERM_KEYS.slice() : perms });
    if (!u.active && u.id === ME.id) u.active = true;
    addEventNote(u);
    save(); closeModal(); render(); toast('User updated.');
  } else {
    const pw = fd.get('pw');
    if (!pw || pw.length < 6) { toast('Password must be at least 6 characters.', 'error'); return; }
    const salt = uid();
    const u = { id: uid(), name, email, salt, pass: hashPw(salt, pw), role, department: dept, active: true,
      permissions: role === 'super_admin' ? PERM_KEYS.slice() : perms, createdAt: nowISO(), createdBy: ME.name, lastLogin: null };
    S.users.push(u);
    save(); closeModal(); render();
    toast('Account created for ' + name + '.');
    notify([u.id], { title: 'Welcome to the ICICE system', body: 'Your account is ready. Please change your password.', link: 'dashboard' });
    save();
  }
};

/* ---------- Boot ---------- */
function boot() {
